<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil Anonyme</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: -apple-system, sans-serif;
      overflow: hidden;
    }

    /* Image de fond */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('Paris_BG.png');
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    /* Dégradé bleu/violet par-dessus, sans mix-blend-mode */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(58, 198, 252, 0.82), rgba(114, 97, 255, 0.82));
    }

    /* Voile haut/bas pour lisibilité */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.15) 0%,
        rgba(0,0,0,0.0)  45%,
        rgba(0,0,0,0.25) 100%
      );
    }

    .page {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 32px;
    }

    .nav-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: rgba(255,255,255,0.88);
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      transition: opacity 0.2s;
    }
    .nav-btn:hover { opacity: 0.7; }

    .nav-icon {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background-color: rgba(245,245,245,0.15);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .nav-icon i { color: white; font-size: 19px; }

    nav h1 {
      color: white;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 16px rgba(0,0,0,0.2);
    }

    .center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .center p {
      color: rgba(255,255,255,0.80);
      font-size: 14px;
      letter-spacing: 0.02em;
      text-shadow: 0 1px 8px rgba(0,0,0,0.3);
    }

    footer {
      display: flex;
      justify-content: center;
      padding: 0 32px 36px;
    }

    .stats-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 16px 52px;
      border-radius: 999px;
      color: white;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 0.01em;
      transition: transform 0.15s, opacity 0.15s;
      background: rgba(0, 89, 179, 0.85);
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 24px rgba(0,89,179,0.35);
    }
    .stats-btn:hover  { transform: translateY(-2px); opacity: 0.9; }
    .stats-btn:active { transform: translateY(0); }
    .stats-btn i { font-size: 18px; }
  </style>
</head>
<body>

  <div class="bg"></div>

  <div class="page">

    <nav>
      <a href="index.html" class="nav-btn">
        <div class="nav-icon"><i class="ti ti-user"></i></div>
        <span>Connexion</span>
      </a>

      <h1>Accueil – Anonyme</h1>

      <a href=" " class="nav-btn">
        <span>Ajouter un fichier / image / photo</span>
        <div class="nav-icon"><i class="ti ti-plus"></i></div>
      </a>
    </nav>

    <div class="center">
      <p>Connectez-vous afin d'accéder à votre historique.</p>
    </div>

    <footer>
      <a href="stats.html" class="stats-btn">
        <i class="ti ti-chart-line"></i>
        Voir les statistiques
      </a>
    </footer>

  </div>

</body>
</html>
